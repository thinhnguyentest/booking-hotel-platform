
services:
  pgadmin:
    image: dpage/pgadmin4
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    networks:
      - spring-network
    depends_on:
      - postgres

  postgres:
    image: postgres:16.8-alpine
    container_name: postgres
    environment:
      POSTGRES_DB: hotel_booking_data
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12341234
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - spring-network
    restart: always
  app:
    build: .
    container_name: spring-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/hotel_booking_data
    depends_on:
      - postgres
    networks:
      - spring-network
    restart: always
  client:
    build:
      context: ../client
      dockerfile: Dockerfile
      args:
        - REACT_APP_API_URL=http://localhost:8080/api
    container_name: react-app
    environment:
      - REACT_APP_API_URL=http://localhost:8080/api
    ports:
      - "3000:80"
    networks:
      - spring-network
    depends_on:
      - app
volumes:
  postgres_data:
  pgadmin_data:
networks:
  spring-network:
    driver: bridge